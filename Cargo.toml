[workspace]
members = ["crates/ethanol-rs-wasm"]

[package]
name = "ethanol-rs"
version = "0.1.0"
edition = "2021"
description = "Cross-platform ethanol pharmacokinetics library (Widmark, Watson, absorption modeling)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smaragden/ethanol-rs"
homepage = "https://github.com/smaragden/ethanol-rs"
keywords = ["bac", "ethanol", "pharmacokinetics", "widmark"]
categories = ["science"]

[lib]
# `lib` (rlib) is the default for Rust consumers. `staticlib` is kept so
# iOS builds can link the .a directly. `cdylib` is *not* declared here —
# leaving it in forces every transitive Rust consumer to build a cdylib
# on every target, which fails under Nix's cc-wrapper when cross-compiling
# to iOS simulator (libiconv.dylib links for macOS, not iOS sim).
#
# The WASM target lives in crates/ethanol-rs-wasm, which declares cdylib
# itself and depends on ethanol-rs as a normal Rust library.
crate-type = ["lib", "staticlib"]

[features]
default = []
mobile = ["uniffi"]
serde = ["dep:serde"]

[dependencies]
uniffi = { version = "0.29", features = ["cli"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["mobile"]

[[bench]]
name = "bac"
harness = false
