[package]
name = "buzz-core"
version = "0.1.0"
edition = "2024"
description = "Blood Alcohol Content (BAC) calculator library for mobile and web platforms"
repository = "https://github.com/yourusername/buzz-core"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = []
mobile = ["uniffi"]
wasm = ["wasm-bindgen", "serde", "serde-wasm-bindgen"]

[dependencies]
uniffi = { version = "0.29", features = ["cli"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"], optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["mobile"]
