[package]
name = "ethanol-rs-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for ethanol-rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smaragden/ethanol-rs"
homepage = "https://github.com/smaragden/ethanol-rs"

[lib]
# wasm-pack requires cdylib for the final .wasm artifact; rlib is kept so
# the crate can still be unit-tested with wasm-pack test.
crate-type = ["cdylib", "rlib"]

[dependencies]
ethanol-rs = { path = "../..", features = ["serde"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
